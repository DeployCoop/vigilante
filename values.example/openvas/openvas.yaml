hostname: openvas.{{DOMAIN}}
domain: {{DOMAIN}}
tlsSecretName: {{TLS_SECRET}}

psgvm:
  POSTGRES_VERSION: "17"
  image:
    repository: registry.community.greenbone.net/community/pg-gvm
    tag: 22.6.13
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi

ospd:
  image:
    repository: registry.community.greenbone.net/community/ospd-openvas
    tag: stable

logLevel: 16
FEED_RELEASE: "24.10"

ospdOpenvas:
  resources:
    requests:
      cpu: 500m
      memory: 250Mi
    limits:
      cpu: 2000m
      memory: 2048Mi

gvmd:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 15Gi

service:
  type: ClusterIP

ingress:
  enabled: true
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: openvas.{{DOMAIN}}
    - host: gvm.{{DOMAIN}}
  tls:
    - secretName: {{TLS_SECRET}}
      hosts:
        - openvas.{{DOMAIN}}
        - gvm.{{DOMAIN}}
