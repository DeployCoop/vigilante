apiVersion: v1
kind: ConfigMap
metadata:
  name: vigil-soc-network-threat-rules
  namespace: vigil-soc
  labels:
    app.kubernetes.io/part-of: vigilante
    vigilante.io/module: vigil-soc
data:
  sigma-network-rules.json: |
    [
      {
        "id": "SIGMA-NET-001",
        "title": "Suspicious Port Scan Activity Detected",
        "severity": "high",
        "category": "reconnaissance",
        "description": "Rapid TCP SYN connections across multiple destination ports from a single external IP.",
        "detection": {
          "selection": {
            "network.transport": "tcp",
            "event.action": "network_connection"
          },
          "condition": "count(destination.port) by source.ip > 50"
        }
      },
      {
        "id": "SIGMA-NET-002",
        "title": "SSH Brute Force Authentication Failure",
        "severity": "high",
        "category": "credential_access",
        "description": "High volume of failed SSH authentications within a short time window.",
        "detection": {
          "selection": {
            "destination.port": 22,
            "event.outcome": "failure"
          },
          "condition": "count(event.id) by source.ip > 10"
        }
      },
      {
        "id": "SIGMA-NET-003",
        "title": "DNS Tunneling / Data Exfiltration Query Length",
        "severity": "critical",
        "category": "command_and_control",
        "description": "Abnormally long base64/hex encoded DNS subdomains querying external authoritative nameservers.",
        "detection": {
          "selection": {
            "network.protocol": "dns",
            "dns.question.type": "TXT"
          },
          "condition": "length(dns.question.name) > 80"
        }
      },
      {
        "id": "SIGMA-NET-004",
        "title": "Suspicious C2 HTTP Beaconing Pattern",
        "severity": "medium",
        "category": "command_and_control",
        "description": "Periodic outbound HTTP POST requests to unclassified external IP with low jitter.",
        "detection": {
          "selection": {
            "http.request.method": "POST",
            "network.direction": "outbound"
          },
          "condition": "count() > 5"
        }
      }
    ]
