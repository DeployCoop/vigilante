# ==============================================================================
# Default Helm Values for OpenSearch Core SIEM Cluster (opensearch)
# ==============================================================================
# Override by placing your custom YAML at:
#   ./values/opensearch/opensearch.yaml or passing --values <file>
# ==============================================================================

clusterName: "opensearch-cluster"
nodeGroup: "master"
replicas: 1
singleNode: true

resources:
  requests:
    cpu: "250m"
    memory: "1024Mi"
  limits:
    cpu: "1500m"
    memory: "2048Mi"

opensearchJavaOpts: "-Xms512m -Xmx1024m"

persistence:
  enabled: false

securityConfig:
  enabled: false

extraEnvs:
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"
  - name: DISABLE_INSTALL_DEMO_CONFIG
    value: "true"
  - name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
    value: "Admin123456!"
