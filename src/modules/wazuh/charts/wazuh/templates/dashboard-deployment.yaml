apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  namespace: {{ include "wazuh.namespace" . }}
  labels:
    {{- include "wazuh.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wazuh
      app.kubernetes.io/component: dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wazuh
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
        - name: wait-for-indexer
          image: {{ .Values.images.busybox }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              while [ "$i" -lt 60 ]; do
                if nc -z wazuh-indexer 9200 && nc -z wazuh-manager 55000; then
                  exit 0
                fi
                i=$((i+1))
                sleep 5
              done
              echo "timed out waiting for wazuh-indexer:9200 and wazuh-manager:55000" >&2
              exit 1
      containers:
        - name: wazuh-dashboard
          image: {{ .Values.images.dashboard }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: INDEXER_USERNAME
              value: {{ .Values.credentials.indexerUsername | quote }}
            - name: INDEXER_PASSWORD
              value: {{ .Values.credentials.indexerPassword | quote }}
            - name: DASHBOARD_USERNAME
              value: {{ .Values.credentials.dashboardUsername | quote }}
            - name: DASHBOARD_PASSWORD
              value: {{ .Values.credentials.dashboardPassword | quote }}
            - name: API_USERNAME
              value: {{ .Values.credentials.apiUsername | quote }}
            - name: API_PASSWORD
              value: {{ .Values.credentials.apiPassword | quote }}
            - name: WAZUH_API_URL
              value: https://wazuh-manager
            - name: API_PORT
              value: "55000"
          ports:
            - name: dashboard
              containerPort: 5601
          startupProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
            - name: certs
              mountPath: /usr/share/wazuh-dashboard/certs
      volumes:
        - name: config
          configMap:
            name: wazuh-config
            items:
              - key: opensearch_dashboards.yml
                path: opensearch_dashboards.yml
        - name: certs
          persistentVolumeClaim:
            claimName: wazuh-certs
