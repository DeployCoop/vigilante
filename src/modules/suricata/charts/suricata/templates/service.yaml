apiVersion: v1
kind: Service
metadata:
  name: {{ include "suricata.fullname" . }}
  namespace: {{ include "suricata.namespace" . }}
  labels:
    {{- include "suricata.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
      protocol: TCP
      name: alerts
  selector:
    app.kubernetes.io/name: {{ include "suricata.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
