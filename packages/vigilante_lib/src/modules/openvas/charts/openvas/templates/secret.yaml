apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openvas.fullname" . }}-admin
  namespace: {{ template "openvas.namespace" . }}
  labels:
    {{- include "openvas.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.admin.username | default "admin" | quote }}
  password: {{ .Values.admin.password | default "admin" | quote }}
  postgresPassword: {{ .Values.psgvm.password | default "gvmd_password" | quote }}
