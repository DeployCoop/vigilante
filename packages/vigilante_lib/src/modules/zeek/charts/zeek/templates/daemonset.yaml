apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zeek.fullname" . }}
  namespace: {{ include "zeek.namespace" . }}
  labels:
    {{- include "zeek.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zeek.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zeek.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      hostNetwork: true
      containers:
        - name: zeek
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          command:
            - /bin/sh
            - -c
            - |
              echo "[zeek] Starting in mirrored mode on {{ .Values.interface }}..."
              mkdir -p /usr/local/zeek/logs /pcap-spool
              {{- if .Values.pcapSpool.enabled }}
              # Background watcher to replay PCAPs dropped into spool directory
              (while true; do
                for f in /pcap-spool/*.pcap /pcap-spool/*.pcapng; do
                  if [ -f "$f" ]; then
                    echo "[zeek:pcap] Replaying $f..."
                    cd /usr/local/zeek/logs && zeek -r "$f" local || true
                    mv "$f" "$f.processed"
                  fi
                done
                sleep 2
              done) &
              {{- end }}
              cd /usr/local/zeek/logs && exec zeek -i {{ .Values.interface }} local
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - mountPath: /usr/local/zeek/logs
              name: zeek-logs
            {{- if .Values.pcapSpool.enabled }}
            - mountPath: /pcap-spool
              name: pcap-spool
            {{- end }}
      volumes:
        - name: zeek-logs
          emptyDir: {}
        {{- if .Values.pcapSpool.enabled }}
        - name: pcap-spool
          hostPath:
            path: {{ .Values.pcapSpool.path }}
            type: DirectoryOrCreate
        {{- end }}
