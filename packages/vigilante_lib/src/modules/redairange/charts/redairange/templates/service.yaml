apiVersion: v1
kind: Service
metadata:
  name: {{ include "redairange.fullname" . }}
  namespace: {{ include "redairange.namespace" . }}
  labels:
    {{- include "redairange.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
    {{- range .Values.service.scenarioPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
      protocol: TCP
    {{- end }}
  selector:
    app.kubernetes.io/name: {{ include "redairange.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
