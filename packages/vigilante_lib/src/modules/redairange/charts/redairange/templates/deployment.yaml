apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redairange.fullname" . }}
  namespace: {{ include "redairange.namespace" . }}
  labels:
    {{- include "redairange.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "redairange.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "redairange.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.stacks.seedBuiltins }}
      initContainers:
        - name: seed-stacks
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              for f in /opt/stacks-seed/*.yaml; do
                [ -f "$f" ] || continue
                name=$(basename "$f" .yaml)
                mkdir -p "{{ .Values.stacks.dir }}/$name"
                if [ ! -f "{{ .Values.stacks.dir }}/$name/compose.yaml" ]; then
                  cp "$f" "{{ .Values.stacks.dir }}/$name/compose.yaml"
                fi
              done
          volumeMounts:
            - name: stacks-seed
              mountPath: /opt/stacks-seed
              readOnly: true
            - name: stacks-storage
              mountPath: {{ .Values.stacks.dir }}
      {{- end }}
      containers:
        - name: redairange
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REDAIRANGE_PORT
              value: {{ .Values.service.port | quote }}
            - name: REDAIRANGE_STACKS_DIR
              value: {{ .Values.stacks.dir | quote }}
            - name: DOCKER_HOST
              value: "unix:///var/run/dind/docker.sock"
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- range .Values.service.scenarioPorts }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run/dind
            - name: app-data
              mountPath: /app/data
            - name: stacks-storage
              mountPath: {{ .Values.stacks.dir }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.service.port }}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.dind.enabled }}
        - name: dind
          image: "{{ .Values.dind.image.repository }}:{{ .Values.dind.image.tag }}"
          imagePullPolicy: {{ .Values.dind.image.pullPolicy }}
          args:
            - "--host=unix:///var/run/dind/docker.sock"
            - "--storage-driver={{ .Values.dind.storageDriver }}"
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: dind-socket
              mountPath: /var/run/dind
            - name: dind-storage
              mountPath: /var/lib/docker
            - name: stacks-storage
              mountPath: {{ .Values.stacks.dir }}
          resources:
            {{- toYaml .Values.dind.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: dind-socket
          emptyDir: {}
        {{- if .Values.stacks.seedBuiltins }}
        - name: stacks-seed
          configMap:
            name: {{ include "redairange.fullname" . }}-stacks-seed
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: app-data
          persistentVolumeClaim:
            claimName: {{ include "redairange.fullname" . }}-data
        - name: stacks-storage
          persistentVolumeClaim:
            claimName: {{ include "redairange.fullname" . }}-stacks
        - name: dind-storage
          persistentVolumeClaim:
            claimName: {{ include "redairange.fullname" . }}-dind
        {{- else }}
        - name: app-data
          emptyDir: {}
        - name: stacks-storage
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
        {{- end }}
