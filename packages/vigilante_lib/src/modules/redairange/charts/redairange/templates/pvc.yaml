{{- if .Values.persistence.enabled -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "redairange.fullname" . }}-data
  namespace: {{ include "redairange.namespace" . }}
  labels:
    {{- include "redairange.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.dataSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "redairange.fullname" . }}-stacks
  namespace: {{ include "redairange.namespace" . }}
  labels:
    {{- include "redairange.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.stacksSize }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "redairange.fullname" . }}-dind
  namespace: {{ include "redairange.namespace" . }}
  labels:
    {{- include "redairange.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClass }}
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.dindStorageSize }}
{{- end }}
