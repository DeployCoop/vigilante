{{- if .Values.bifrost.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vigil.bifrost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
spec:
  type: {{ .Values.bifrost.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.bifrost.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: bifrost
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vigil.componentLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
spec:
  type: {{ .Values.bifrost.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ .Values.bifrost.service.port | default 8080 }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "vigil.componentSelectorLabels" (dict "context" . "component" "bifrost") | nindent 4 }}
{{- end }}
