apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: challenges.kctf.dev
  annotations:
    description: "Google kCTF Challenge Custom Resource Definition"
spec:
  group: kctf.dev
  names:
    kind: Challenge
    listKind: ChallengeList
    plural: challenges
    singular: challenge
    shortNames:
      - chal
      - chals
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: Challenge is the Schema for the kCTF challenges API
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: ChallengeSpec defines the desired state of a Challenge
              type: object
              properties:
                deployed:
                  description: Whether this challenge is active and deployed
                  type: boolean
                  default: true
                category:
                  description: CTF challenge category (e.g. web, pwn, crypto, rev, forensics, misc)
                  type: string
                  default: misc
                powDifficultySeconds:
                  description: Proof of Work difficulty in seconds (0 = disabled)
                  type: integer
                  default: 0
                network:
                  description: Network configuration for the challenge
                  type: object
                  properties:
                    public:
                      description: Whether the challenge service is exposed publicly
                      type: boolean
                      default: true
                    ports:
                      description: Ports exposed by the challenge
                      type: array
                      items:
                        type: object
                        required:
                          - port
                        properties:
                          name:
                            type: string
                          port:
                            type: integer
                          targetPort:
                            type: integer
                          protocol:
                            type: string
                            default: TCP
                podTemplate:
                  description: Template describing the challenge pod
                  type: object
                  properties:
                    template:
                      type: object
                      properties:
                        spec:
                          type: object
                          properties:
                            containers:
                              type: array
                              items:
                                type: object
                                required:
                                  - name
                                properties:
                                  name:
                                    type: string
                                  image:
                                    type: string
                                  command:
                                    type: array
                                    items:
                                      type: string
                                  args:
                                    type: array
                                    items:
                                      type: string
                                  env:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                        - name
                                      properties:
                                        name:
                                          type: string
                                        value:
                                          type: string
                                  ports:
                                    type: array
                                    items:
                                      type: object
                                      required:
                                        - containerPort
                                      properties:
                                        name:
                                          type: string
                                        containerPort:
                                          type: integer
                                        protocol:
                                          type: string
                                          default: TCP
                                  resources:
                                    type: object
            status:
              description: ChallengeStatus defines the observed state of a Challenge
              type: object
              properties:
                health:
                  type: string
                  description: Health status of the challenge
                endpoints:
                  type: array
                  items:
                    type: string
      additionalPrinterColumns:
        - name: Category
          type: string
          jsonPath: .spec.category
        - name: Deployed
          type: boolean
          jsonPath: .spec.deployed
        - name: PoW
          type: integer
          jsonPath: .spec.powDifficultySeconds
        - name: Status
          type: string
          jsonPath: .status.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
