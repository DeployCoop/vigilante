apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencti.fullname" . }}-minio
  namespace: {{ include "opencti.namespace" . }}
  labels:
    {{- include "opencti.componentLabels" (dict "context" . "component" "minio") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
  selector:
    {{- include "opencti.componentSelectorLabels" (dict "context" . "component" "minio") | nindent 4 }}
