apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencti.fullname" . }}-rabbitmq
  namespace: {{ include "opencti.namespace" . }}
  labels:
    {{- include "opencti.componentLabels" (dict "context" . "component" "rabbitmq") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
      protocol: TCP
    - name: management
      port: 15672
      targetPort: management
      protocol: TCP
  selector:
    {{- include "opencti.componentSelectorLabels" (dict "context" . "component" "rabbitmq") | nindent 4 }}
