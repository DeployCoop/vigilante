apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencti.fullname" . }}-redis
  namespace: {{ include "opencti.namespace" . }}
  labels:
    {{- include "opencti.componentLabels" (dict "context" . "component" "redis") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "opencti.componentSelectorLabels" (dict "context" . "component" "redis") | nindent 4 }}
