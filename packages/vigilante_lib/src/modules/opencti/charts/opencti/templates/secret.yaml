{{- /*
OpenCTI credentials. Every value is required: the module passes them via
--set (generated on first install, reused from this Secret afterwards).
A direct `helm template` without them fails loudly instead of deploying
with a published default password.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: opencti-credentials
  namespace: {{ include "opencti.namespace" . }}
  labels:
    {{- include "opencti.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENCTI_ADMIN_PASSWORD: {{ required "secrets.adminPassword is required (pass --set secrets.adminPassword=...)" .Values.secrets.adminPassword | quote }}
  OPENCTI_ADMIN_TOKEN: {{ required "secrets.adminToken is required (pass --set secrets.adminToken=...)" .Values.secrets.adminToken | quote }}
  RABBITMQ_PASSWORD: {{ required "secrets.rabbitmqPassword is required (pass --set secrets.rabbitmqPassword=...)" .Values.secrets.rabbitmqPassword | quote }}
  MINIO_ROOT_PASSWORD: {{ required "secrets.minioPassword is required (pass --set secrets.minioPassword=...)" .Values.secrets.minioPassword | quote }}
