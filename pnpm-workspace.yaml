packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  # Native/build packages the workspace actually needs: gitnexus (a direct
  # root dependency) and its LadybugDB + tree-sitter grammar builds, the
  # onnxruntime native binary, and the protobufjs/unrs-resolver postinstalls.
  '@ladybugdb/core': true
  # @scarf/scarf is an analytics beacon, not a build step — keep it off.
  '@scarf/scarf': false
  gitnexus: true
  onnxruntime-node: true
  protobufjs: true
  tree-sitter: true
  tree-sitter-c-sharp: true
  tree-sitter-cpp: true
  tree-sitter-go: true
  tree-sitter-java: true
  tree-sitter-javascript: true
  tree-sitter-php: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - nastymap@1.0.1
